name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    - name: Accept Android Licenses
      run: |
        yes | flutter doctor --android-licenses || true

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flet

    # Projeyi Flet ile derlemek yerine doğrudan flet run/build altyapısının gereksinimlerini hazırlıyoruz
    - name: Build APK via Flet CLI
      env:
        FLET_FORCE_BUILD: "true"
      run: |
        python -c "import flet; print(flet.__version__)"
        flet build apk --project-name "anorth" --description "North AI Chat" --org "com.north.ai"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/apk/*.apk
