name: Build Flet APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'
        cache: true

    - name: Accept Android Licenses
      run: |
        yes | flutter doctor --android-licenses || true

    - name: Install Python Dependencies & Flet
      run: |
        python -m pip install --upgrade pip
        pip install flet

    # Flet'in paketleme motorunu tetikleyip Flutter klasör yapısının oluşmasını sağlıyoruz (Hata verirse yoksayar)
    - name: Generate Flutter Project Structure via Flet
      run: |
        python -c "import subprocess; subprocess.run(['flet', 'pack', 'main.py'])" || true

    # Flet'in komutunu KULLANMIYORUZ. Doğrudan Flutter ile release APK derliyoruz (Sıfır interaktif soru, sıfır EOFError!)
    - name: Build APK Directly with Flutter
      run: |
        flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
